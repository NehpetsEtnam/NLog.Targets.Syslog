name: Build and publish

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the package to nuget.org'
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  LIBRARY_PROJECT: src/NLog.Targets.Syslog/NLog.Targets.Syslog.csproj
  TEST_PROJECT: src/NLog.Targets.Syslog.Tests/NLog.Targets.Syslog.Tests.csproj

# Least privilege by default; only the publish job asks for an OIDC token.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The socket option constants are OS-specific, so the tests run on each OS family.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release

  pack:
    name: Pack
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SourceLink needs the commit history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Version = the 3-part [Release Version] in src/Build-Info.txt plus the run number,
      # matching the existing 4-part package versions (e.g. 8.1.0.2).
      - name: Compute version
        id: version
        shell: bash
        run: |
          release=$(awk '/^\[Release Version\]/ { getline; gsub(/[[:space:]]/, ""); print; exit }' src/Build-Info.txt)
          if ! [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read a 3-part [Release Version] from src/Build-Info.txt (got '$release')"
            exit 1
          fi

          # Build-Info.txt and the csproj both name the package; fail rather than publish under the wrong ID.
          infoName=$(awk '/^\[Package Name\]/ { getline; gsub(/[[:space:]]/, ""); print; exit }' src/Build-Info.txt)
          packageId=$(sed -n 's:.*<PackageId>\(.*\)</PackageId>.*:\1:p' ${{ env.LIBRARY_PROJECT }} | tr -d '[:space:]')
          if [ "$infoName" != "$packageId" ]; then
            echo "::error::[Package Name] in src/Build-Info.txt ('$infoName') does not match <PackageId> in the csproj ('$packageId')"
            exit 1
          fi

          version="$release.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      # Build and pack are separate steps: the project sets GeneratePackageOnBuild, and packing in
      # the same step as the build fails with NU5026.
      - name: Build
        run: >
          dotnet build ${{ env.LIBRARY_PROJECT }} --configuration Release
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: >
          dotnet pack ${{ env.LIBRARY_PROJECT }} --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.version }}
          --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 15

  # Trusted Publishing: nuget.org trusts this repo + workflow file + environment through a policy,
  # and NuGet/login exchanges the job's GitHub OIDC token for a short-lived API key. No long-lived
  # key is stored anywhere. The policy must name this exact file: build-and-publish.yml.
  publish:
    name: Publish to nuget.org
    needs: pack
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # required for NuGet/login; without it the login fails with 403
      contents: read
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts

      # Immediately before the push: the short-lived key expires after about an hour.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not the email address

      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
